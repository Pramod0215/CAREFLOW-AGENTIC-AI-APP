services:
  backend:
    build:
      context: ./backend
    environment:
      CAREFLOW_DATA_DIR: /service/data
      CAREFLOW_TOKEN_SECRET: ${CAREFLOW_TOKEN_SECRET:-local-demo-secret-change-before-deployment}
      CAREFLOW_ENV: ${CAREFLOW_ENV:-development}
      CAREFLOW_ALLOWED_ORIGINS: http://localhost:8080
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-}
      HF_CHAT_URL: ${HF_CHAT_URL:-https://router.huggingface.co/v1/chat/completions}
    volumes:
      - careflow-data:/service/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  careflow-data:
